name: Wire Phase 6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Phase 6 script tag
        run: |
          if grep -q 'phase6.js' index.html; then
            echo 'Phase 6 already wired.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          needle='</body>'
          if needle not in s:
              raise SystemExit('Missing </body> in index.html')
          s=s.replace(needle,'<script src="/phase6.js"></script></body>',1)
          p.write_text(s)
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Phase 6 random event engine'
          git push
